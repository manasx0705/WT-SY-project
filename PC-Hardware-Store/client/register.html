<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PC Hardware Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">PC Hardware Store</a>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search products...">
            <button onclick="searchProducts()">Search</button>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                <li><a href="login.html" id="account-link">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="form-container">
            <h2 style="text-align: center; margin-bottom: 20px;">Create Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-pass" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="reg-conf-pass" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Register</button>
            </form>
            <br>
            <p style="text-align: center;">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 PC Hardware Store. A college project.</p>
    </footer>

    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            let p1 = document.getElementById('reg-pass').value;
            let p2 = document.getElementById('reg-conf-pass').value;
            if(p1 !== p2) {
                e.preventDefault();
                alert("Passwords do not match!");
            }
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
