<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - PC Hardware Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">PC Hardware Store</a>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search products...">
            <button onclick="searchProducts()">Search</button>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                <li><a href="login.html" id="account-link">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div id="single-product" style="display:flex; gap: 30px; margin-top:20px; background:white; padding:20px; border:1px solid #ddd;">
            <div style="flex:1;">
                <img id="prodImage" src="" alt="Product Image" style="max-width:100%;">
            </div>
            <div style="flex:2;">
                <h2 id="prodName">Loading...</h2>
                <br>
                <p id="prodCategory" style="color: #666;"></p>
                <br>
                <h3 id="prodPrice" style="color: #0056b3;"></h3>
                <br>
                <p id="prodDesc"></p>
                <br>
                <div>
                    <label>Quantity: </label>
                    <input type="number" id="prodQty" value="1" min="1" style="width:50px; padding:5px;">
                </div>
                <br>
                <button id="addToCartBtn" class="btn">Add to Cart</button>
                <a href="checkout.html" class="btn" style="background-color: #ff9800;">Buy Now</a>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 PC Hardware Store. A college project.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
