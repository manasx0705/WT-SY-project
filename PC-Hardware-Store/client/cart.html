<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - PC Hardware Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">PC Hardware Store</a>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search products...">
            <button onclick="searchProducts()">Search</button>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                <li><a href="login.html" id="account-link">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Your Shopping Cart</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="cart-body">
                <!-- Javascript will load items here -->
            </tbody>
        </table>
        
        <br>
        <h3 style="text-align: right;">Total: ₹<span id="cart-total">0</span></h3>
        <div style="text-align: right; margin-top: 15px;">
            <a href="checkout.html" class="btn" style="background-color: #28a745; font-size: 18px;">Proceed to Checkout</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 PC Hardware Store. A college project.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
