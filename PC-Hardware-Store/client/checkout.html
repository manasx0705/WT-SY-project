<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - PC Hardware Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html">PC Hardware Store</a>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search products...">
            <button onclick="searchProducts()">Search</button>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="categories.html">Categories</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                <li><a href="login.html" id="account-link">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container" style="display:flex; gap: 20px; flex-wrap: wrap;">
        <div style="flex: 2; min-width: 300px;">
            <h2>Checkout Details</h2>
            <br>
            <form id="checkout-form" class="admin-container" action="place_order.php" method="POST">
                <input type="hidden" name="cart_data" id="cart_data">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <textarea name="address" rows="3" required></textarea>
                </div>
                <div style="display:flex; gap: 10px;">
                    <div class="form-group" style="flex:1;">
                        <label>City</label>
                        <input type="text" name="city" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>State</label>
                        <input type="text" name="state" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>PIN Code</label>
                        <input type="text" name="pincode" required>
                    </div>
                </div>
                
                <h3>Payment Method</h3>
                <br>
                <div class="form-group">
                    <select name="payment" required>
                        <option value="">Select Payment Method</option>
                        <option value="upi">UPI</option>
                        <option value="card">Card</option>
                        <option value="netbanking">Net Banking</option>
                        <option value="cod">Cash on Delivery</option>
                    </select>
                </div>
                
                <button type="submit" class="btn" style="background-color: #28a745; width:100%; font-size:16px;">Place Order</button>
            </form>
        </div>
        
        <div style="flex: 1; min-width: 250px;">
            <div class="admin-container">
                <h2>Order Summary</h2>
                <br>
                <div id="order-summary">
                    <!-- Javascript will load summary here -->
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 PC Hardware Store. A college project.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
